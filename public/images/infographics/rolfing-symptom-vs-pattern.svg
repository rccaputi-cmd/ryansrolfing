<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Rolfing looks beyond symptoms</title><desc id="desc">Infographic showing that the painful area is not always the whole pattern.</desc>
<rect width="1200" height="900" rx="36" fill="#f8f6f2"/>
<text x="600" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="52" fill="#545454">The painful place may not be the whole story</text>
<text x="600" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#545454">Rolfing asks: what pattern is asking that area to work so hard?</text>
<g font-family="Arial, sans-serif">
  <g transform="translate(120 240)"><rect width="420" height="440" rx="30" fill="white" stroke="#e8e1d7"/><text x="210" y="58" text-anchor="middle" font-size="30" fill="#9b7139" font-weight="700">Symptom focus</text><circle cx="196" cy="150" r="40" fill="none" stroke="#b85c4a" stroke-width="8"/><path d="M210 110 C185 160 184 230 210 285 C190 335 190 365 210 395" fill="none" stroke="#545454" stroke-width="13" stroke-linecap="round"/><circle cx="210" cy="88" r="28" fill="none" stroke="#545454" stroke-width="10"/><path d="M208 200 L138 255 M208 200 L286 250 M210 285 L162 382 M210 285 L258 382" fill="none" stroke="#545454" stroke-width="10" stroke-linecap="round"/><text x="210" y="488" text-anchor="middle" font-size="20" fill="#545454">“My neck hurts.”</text></g>
  <g transform="translate(660 240)"><rect width="420" height="440" rx="30" fill="white" stroke="#e8e1d7"/><text x="210" y="58" text-anchor="middle" font-size="30" fill="#9b7139" font-weight="700">Pattern focus</text><path d="M210 110 C195 170 198 230 210 285 C202 335 203 365 210 395" fill="none" stroke="#545454" stroke-width="13" stroke-linecap="round"/><circle cx="210" cy="88" r="28" fill="none" stroke="#545454" stroke-width="10"/><path d="M208 200 L138 255 M208 200 L286 250 M210 285 L162 382 M210 285 L258 382" fill="none" stroke="#545454" stroke-width="10" stroke-linecap="round"/><circle cx="210" cy="190" r="18" fill="#c4924a" opacity=".85"/><circle cx="185" cy="287" r="18" fill="#c4924a" opacity=".65"/><circle cx="162" cy="382" r="18" fill="#c4924a" opacity=".45"/><path d="M162 382 C130 312 150 236 210 190" fill="none" stroke="#c4924a" stroke-width="5" stroke-dasharray="10 10"/><text x="210" y="488" text-anchor="middle" font-size="20" fill="#545454">“What is the whole pattern?”</text></g>
</g>
<text x="600" y="805" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#545454">This is why work at the feet, pelvis, ribs, or breath can change neck, back, or shoulder strain.</text>
</svg>