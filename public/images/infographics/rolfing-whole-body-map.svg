<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Rolfing works with the whole body</title><desc id="desc">An educational infographic showing fascia, posture, movement, breath, and nervous system as connected parts of Rolfing.</desc>
<rect width="1200" height="900" rx="36" fill="#f8f6f2"/>
<text x="600" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="54" fill="#545454">Rolfing works with the whole body</text>
<text x="600" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#545454">Structure • movement • perception • nervous system</text>
<g transform="translate(600 470)">
  <circle r="210" fill="#ffffff" stroke="#e8e1d7" stroke-width="4"/>
  <path d="M0 -150 C-38 -135 -58 -92 -42 -56 C-78 -22 -80 38 -35 70 L-55 175 M0 -150 C38 -135 58 -92 42 -56 C78 -22 80 38 35 70 L55 175 M-42 -56 C-8 -35 8 -35 42 -56 M-35 70 C-12 92 12 92 35 70 M0 -132 L0 176" fill="none" stroke="#c4924a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  <circle cx="0" cy="-185" r="34" fill="none" stroke="#c4924a" stroke-width="10" opacity=".85"/>
  <path d="M-150 -30 C-90 -90 -30 -90 30 -30 S150 30 170 -60" fill="none" stroke="#9b7139" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <path d="M-160 75 C-100 15 -35 20 20 80 S125 140 170 70" fill="none" stroke="#9b7139" stroke-width="5" stroke-linecap="round" opacity=".55"/>
</g>
<line x1="600" y1="470" x2="250" y2="265" stroke="#e8e1d7" stroke-width="3"/><line x1="600" y1="470" x2="950" y2="265" stroke="#e8e1d7" stroke-width="3"/><line x1="600" y1="470" x2="245" y2="650" stroke="#e8e1d7" stroke-width="3"/><line x1="600" y1="470" x2="955" y2="650" stroke="#e8e1d7" stroke-width="3"/>
<g font-family="Arial, sans-serif" fill="#545454">
  <g transform="translate(90 205)"><rect width="320" height="135" rx="24" fill="white" stroke="#e8e1d7"/><text x="160" y="48" text-anchor="middle" font-size="26" fill="#9b7139" font-weight="700">Fascia</text><text x="160" y="86" text-anchor="middle" font-size="20">connective tissue web</text><text x="160" y="114" text-anchor="middle" font-size="20">that links the whole body</text></g>
  <g transform="translate(790 205)"><rect width="320" height="135" rx="24" fill="white" stroke="#e8e1d7"/><text x="160" y="48" text-anchor="middle" font-size="26" fill="#9b7139" font-weight="700">Posture</text><text x="160" y="86" text-anchor="middle" font-size="20">how your body organizes</text><text x="160" y="114" text-anchor="middle" font-size="20">itself in gravity</text></g>
  <g transform="translate(90 590)"><rect width="320" height="135" rx="24" fill="white" stroke="#e8e1d7"/><text x="160" y="48" text-anchor="middle" font-size="26" fill="#9b7139" font-weight="700">Movement</text><text x="160" y="86" text-anchor="middle" font-size="20">more options, less strain,</text><text x="160" y="114" text-anchor="middle" font-size="20">better coordination</text></g>
  <g transform="translate(790 590)"><rect width="320" height="135" rx="24" fill="white" stroke="#e8e1d7"/><text x="160" y="48" text-anchor="middle" font-size="26" fill="#9b7139" font-weight="700">Nervous system</text><text x="160" y="86" text-anchor="middle" font-size="20">safety, regulation,</text><text x="160" y="114" text-anchor="middle" font-size="20">and body awareness</text></g>
</g>
<text x="600" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#545454">The goal is not to force “perfect posture” — it is to help the body find easier organization.</text>
</svg>