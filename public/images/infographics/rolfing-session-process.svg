<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">What happens in a Rolfing session</title><desc id="desc">Four step infographic explaining assessment, hands-on work, movement education, and integration.</desc>
<rect width="1200" height="900" rx="36" fill="#f8f6f2"/>
<text x="600" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="54" fill="#545454">What happens in a Rolfing session?</text>
<text x="600" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#545454">A collaborative process: assess, work, move, integrate.</text>
<g font-family="Arial, sans-serif">
<line x1="245" y1="420" x2="350" y2="420" stroke="#e8e1d7" stroke-width="6" stroke-linecap="round"/><line x1="480" y1="420" x2="585" y2="420" stroke="#e8e1d7" stroke-width="6" stroke-linecap="round"/><line x1="715" y1="420" x2="820" y2="420" stroke="#e8e1d7" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(90 260)"><circle cx="110" cy="160" r="88" fill="white" stroke="#c4924a" stroke-width="5"/><text x="110" y="153" text-anchor="middle" font-size="46" fill="#9b7139" font-weight="700">1</text><text x="110" y="190" text-anchor="middle" font-size="21" fill="#545454">Assess</text><text x="110" y="300" text-anchor="middle" font-size="24" fill="#9b7139" font-weight="700">Listen &amp; look</text><text x="110" y="335" text-anchor="middle" font-size="19" fill="#545454">history, goals, posture,</text><text x="110" y="362" text-anchor="middle" font-size="19" fill="#545454">movement, comfort</text></g>
  <g transform="translate(325 260)"><circle cx="110" cy="160" r="88" fill="white" stroke="#c4924a" stroke-width="5"/><text x="110" y="153" text-anchor="middle" font-size="46" fill="#9b7139" font-weight="700">2</text><text x="110" y="190" text-anchor="middle" font-size="21" fill="#545454">Work</text><text x="110" y="300" text-anchor="middle" font-size="24" fill="#9b7139" font-weight="700">Hands-on contact</text><text x="110" y="335" text-anchor="middle" font-size="19" fill="#545454">specific pressure, pace,</text><text x="110" y="362" text-anchor="middle" font-size="19" fill="#545454">and tissue responsiveness</text></g>
  <g transform="translate(560 260)"><circle cx="110" cy="160" r="88" fill="white" stroke="#c4924a" stroke-width="5"/><text x="110" y="153" text-anchor="middle" font-size="46" fill="#9b7139" font-weight="700">3</text><text x="110" y="190" text-anchor="middle" font-size="21" fill="#545454">Move</text><text x="110" y="300" text-anchor="middle" font-size="24" fill="#9b7139" font-weight="700">Repattern</text><text x="110" y="335" text-anchor="middle" font-size="19" fill="#545454">breath, awareness,</text><text x="110" y="362" text-anchor="middle" font-size="19" fill="#545454">coordination, options</text></g>
  <g transform="translate(795 260)"><circle cx="110" cy="160" r="88" fill="white" stroke="#c4924a" stroke-width="5"/><text x="110" y="153" text-anchor="middle" font-size="46" fill="#9b7139" font-weight="700">4</text><text x="110" y="190" text-anchor="middle" font-size="21" fill="#545454">Integrate</text><text x="110" y="300" text-anchor="middle" font-size="24" fill="#9b7139" font-weight="700">Let it settle</text><text x="110" y="335" text-anchor="middle" font-size="19" fill="#545454">your system learns</text><text x="110" y="362" text-anchor="middle" font-size="19" fill="#545454">a new way to organize</text></g>
</g>
<rect x="160" y="735" width="880" height="70" rx="24" fill="white" stroke="#e8e1d7"/>
<text x="600" y="779" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#545454">The work is adapted to your body — not forced into a formula.</text>
</svg>