[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json engines require Node >= 22.12. Existing sites can stay pinned
  # to an older runtime in the Netlify UI; this keeps deploy previews on Node 22.
  NODE_VERSION = "22"

# Square booking is a normal link, not an embed, so this CSP does not block it.
# script-src and style-src allow 'unsafe-inline' because the official Clarity tag is inline,
# Astro inlines the review toggle and check-in scripts, and /review-card/ is a static page
# with an inline style block and an onclick handler. A hash-only policy would block those.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; frame-src https://*.clarity.ms https://c.bing.com; script-src 'self' 'unsafe-inline' https://*.clarity.ms https://c.bing.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://*.clarity.ms https://c.bing.com; connect-src 'self' https://*.clarity.ms https://c.bing.com https://fonts.googleapis.com https://fonts.gstatic.com; media-src 'self'; worker-src 'self' blob: https://*.clarity.ms"
